<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe3">
<title>Mapa de España — Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe3; --ink:#2a221d; --muted:#7a6c60; --card:#fffdf8; --line:#eadfcd;
  --accent:#c2410c; --accent-soft:#fde3cf; --sea:#cfe4ef; --land:#ece2cf; --land2:#e6dbc6;
  --ok:#2f9e5b; --ok-soft:#d8f1e1; --bad:#d23f31; --bad-soft:#fbe0dc; --hl:#f08a24;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{max-width:1440px;margin:0 auto;padding:18px 24px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand h1{font-family:Fraunces,serif;font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:6px;background:#efe5d4;padding:5px;border-radius:999px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;font:600 14px Inter,sans-serif;color:#5b4d42;padding:9px 16px;border-radius:999px;cursor:pointer}
nav.tabs button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(60,40,20,.15)}
.layout{max-width:1440px;margin:0 auto;padding:0 24px 28px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
.mapcard{background:var(--sea);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(60,40,20,.08),0 8px 30px rgba(60,40,20,.08);position:relative}
#map{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(60,40,20,.08),0 8px 30px rgba(60,40,20,.08);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.panel h2{font-family:Fraunces,serif;font-size:21px;margin:0 0 6px}
.panel p{margin:6px 0;line-height:1.45}
.muted{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 16px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:#f1e8da;color:#4e4137}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sets{display:grid;gap:8px;margin:12px 0}
.setbtn{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:600 15px Inter,sans-serif;color:var(--ink);cursor:pointer}
.setbtn:hover{border-color:var(--accent);background:#fff8f2}
.setbtn small{color:var(--muted);font-weight:500}
.setbtn:disabled{opacity:.45;cursor:default}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0;cursor:pointer}
.toggle input{accent-color:var(--accent);width:17px;height:17px}
.prompt{background:#fff6ee;border:1.5px solid var(--accent-soft);border-radius:16px;padding:14px 16px;margin:6px 0 10px}
.prompt small{display:block;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.prompt .target{font-family:Fraunces,serif;font-size:27px;font-weight:800;color:var(--accent);line-height:1.15;margin-top:2px}
.bar{height:7px;background:#efe5d4;border-radius:9px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.fb{min-height:46px;margin:10px 0;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.4;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:#1d6b3d}
.fb.bad{background:var(--bad-soft);color:#9b2a1f}
.fb.warn{background:#fff1c9;color:#7a5600}
.fb mark{background:#ffd36b;color:inherit;border-radius:3px;padding:0 1px;font-weight:700}
.ans{font-family:Fraunces,serif;font-weight:700;font-size:18px}
input.type{width:100%;font:500 19px Inter,sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:#fff;color:var(--ink)}
input.type:focus{border-color:var(--accent)}
.keys{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.keys button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:600 18px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.keys button:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:500 13px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);background:#fff8f2}
.chip .miss{color:var(--bad);font-weight:700;margin-left:4px}
.info{border-left:4px solid var(--accent);background:#fff8f2;padding:10px 12px;border-radius:0 12px 12px 0;margin:10px 0}
.info b{font-family:Fraunces,serif;font-size:20px;display:block}
.grouph{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:12px 0 4px}
.simlist{display:grid;gap:6px;margin:10px 0}
.simrow{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:center}
.simrow .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font:700 13px Inter,sans-serif;display:grid;place-items:center}
.simrow input{font:500 15px Inter,sans-serif;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;width:100%;outline:none}
.simrow input:focus{border-color:var(--accent)}
.simrow.ok input{border-color:var(--ok);background:var(--ok-soft)}
.simrow.bad input{border-color:var(--bad);background:var(--bad-soft)}
.simrow .corr{grid-column:2;font-size:13px;color:#9b2a1f;margin-top:-2px}
.simrow .corr mark{background:#ffd36b;color:inherit;border-radius:3px;font-weight:700}
.big{font-family:Fraunces,serif;font-size:46px;font-weight:800;line-height:1;margin:8px 0}
.misslist{margin:8px 0;padding-left:18px;font-size:14px;line-height:1.6}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.45}
kbd{font:600 12px Inter,sans-serif;background:#f1e8da;border-radius:5px;padding:1px 6px}

.lessons{display:grid;gap:6px;margin:8px 0}
.lesson{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.lesson:hover{border-color:var(--accent)}
.lesson .ln{flex:none;width:30px;height:30px;border-radius:50%;background:#f1e8da;display:grid;place-items:center;font-weight:700;font-size:14px;color:#5b4d42}
.lesson.done .ln{background:var(--ok);color:#fff}
.lesson.next{border-color:var(--accent);background:#fff8f2}
.lesson.next .ln{background:var(--accent);color:#fff}
.lesson.review .ln{background:#f3d36b;color:#5a4300}
.lesson.done.review .ln{background:var(--ok);color:#fff}
.lesson .lt{flex:1;min-width:0}
.lesson .lt b{display:block;font-size:15px}
.lesson .lt small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .go{flex:none;color:var(--accent);font-weight:700;font-size:13px}
.lhead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.lhead .muted{font-weight:600;text-align:right}
.steps{display:flex;gap:4px;margin:4px 0 8px}
.steps span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-radius:8px;background:#f1e8da;color:#9a8b7d}
.steps span.on{background:var(--accent);color:#fff}
.steps span.past{background:var(--ok-soft);color:#1d6b3d}
.tip{background:#eef5fa;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin:6px 0 10px;color:#2d4b5c}
.intro{padding:4px 0}
.bigname{font-family:Fraunces,serif;font-weight:800;font-size:34px;line-height:1.1;color:var(--ink);margin:2px 0}
.acc{color:var(--accent);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.prompt .target .acc{color:var(--accent)}
.donebox{text-align:center;padding:10px 0}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:600 14px Inter,sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.who:hover{border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(42,34,29,.45);display:grid;place-items:center;z-index:50;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--card);border-radius:20px;padding:22px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-family:Fraunces,serif;margin:0 0 4px;font-size:24px}
.wholist{display:grid;gap:6px;margin-top:12px}
.whorow{display:flex;gap:6px}
.whorow .pick{flex:1;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font:600 16px Inter,sans-serif;color:var(--ink);cursor:pointer}
.whorow .pick:hover,.whorow .pick.cur{border-color:var(--accent);background:#fff8f2}
.whorow .pick small{color:var(--muted);font-weight:500;margin-left:6px}
.whorow .del{border:0;background:#f1e8da;border-radius:12px;padding:0 12px;cursor:pointer;color:#7a6c60;font:600 13px Inter,sans-serif}
.whorow .del.sure{background:var(--bad);color:#fff}
nav.tabs .ic{display:none}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomctl button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(60,40,20,.12);background:rgba(255,253,248,.95);font:600 20px Inter,sans-serif;color:#4e4137;cursor:pointer;box-shadow:0 1px 4px rgba(60,40,20,.15);touch-action:manipulation}
.zoomctl button:hover{color:var(--accent)}
#zReset{font-size:17px}
#map{touch-action:pan-y}
#map.zoomed{touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
@media (pointer:coarse){.hit{stroke-width:30}.pt .hitc{r:22px}}
/* ---- SVG ---- */
#map text{font-family:Inter,sans-serif;paint-order:stroke;stroke:#fffdf8;stroke-width:calc(var(--u,1.5)*3.2px);stroke-linejoin:round;pointer-events:none}
#map path,#map rect{vector-effect:non-scaling-stroke}
.other{fill:#e2ddd3;stroke:#cfc8bb;stroke-width:1}
.otherlbl{fill:#a89f92;font-size:calc(var(--u,1.5)*11px);font-weight:700;letter-spacing:.25em;stroke:none!important}
.feat{cursor:pointer}
.region path{fill:var(--land);stroke:#fffdf8;stroke-width:1.4;stroke-linejoin:round;transition:fill .15s}
svg.colors .region path{fill:var(--c)}
.region .hitarea{fill:transparent!important;stroke:none!important}
.zone .vis{fill:transparent;transition:fill .15s}
.range .vis{fill:none;stroke:#8b5e34;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;opacity:.62}
.river .vis{fill:none;stroke:#2f7fc1;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.hit{fill:none;stroke:transparent;stroke-width:20;stroke-linecap:round;pointer-events:stroke}
.pt .hitc{fill:transparent}
.sc{transform:scale(var(--u,1.5))}
.pt .vis{fill:#fff;stroke:#3b2f2a;stroke-width:2}
.pt.peak .vis{fill:#8b5e34;stroke:#fffdf8;stroke-width:1.6}
.pt.rock .vis{fill:#6d6a8a;stroke:#fffdf8;stroke-width:1.6}
.inset rect.box{fill:#c3dbe8;stroke:#9fbccc;stroke-width:1.2;stroke-dasharray:5 4}
.inset text.ttl{font-size:17px;font-weight:700;fill:#5d7a8a;stroke:none}
.minor{fill:#b9b2a6;font-size:calc(var(--u,1.5)*9px)}
@media (hover:hover){
.region:hover path:not(.hitarea){fill:#f6c98d}
.zone:hover .vis{fill:rgba(255,255,255,.4)}
.range:hover .vis{opacity:1}
.river:hover .vis{stroke-width:4.5}
.pt:hover .vis{stroke:var(--hl);stroke-width:2.5}
}
/* states */
.region.ok path:not(.hitarea){fill:#86cf9e!important}
.region.bad path:not(.hitarea){fill:#f0928a!important}
.region.target path:not(.hitarea),.region.sel path:not(.hitarea){fill:var(--hl)!important}
.range.ok .vis,.river.ok .vis{stroke:var(--ok);opacity:1;stroke-width:6}
.range.bad .vis,.river.bad .vis{stroke:var(--bad);opacity:1;stroke-width:6}
.range.target .vis,.river.target .vis,.range.sel .vis,.river.sel .vis{stroke:var(--hl);opacity:1;stroke-width:7}
.zone.ok .vis{fill:rgba(47,158,91,.35)} .zone.bad .vis{fill:rgba(210,63,49,.3)}
.zone.target .vis,.zone.sel .vis{fill:rgba(240,138,36,.45)}
.pt.ok .vis{fill:var(--ok)} .pt.bad .vis{fill:var(--bad)}
.pt.target .vis,.pt.sel .vis{fill:var(--hl);stroke:#fff;stroke-width:2}
.target{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
/* modes */
svg.hide-lm #lmLayer,svg.hide-lm .lbl-lm{display:none}
svg.lm-only .region{pointer-events:none}
svg.lm-only .region path{fill:var(--land2)}
svg.passive .feat{pointer-events:none}
#labels{display:none}
svg.names #labels,svg.picknames #labels{display:block}
svg.picknames:not(.names) #labels text:not(.on){display:none}
svg.lm-only.picknames #labels .lbl-com{display:none}
.region.learned path:not(.hitarea){fill:var(--c)}
.lbl-com{font-size:calc(var(--u,1.5)*12.5px);font-weight:700;fill:#3a2f27}
.lbl-lm{font-size:calc(var(--u,1.5)*11px);font-weight:600;fill:#6b4521;font-style:italic}
.lbl-lm.k-river{fill:#1f5f99}
.lbl-lm.k-zone{fill:#3d6f8c;font-size:calc(var(--u,1.5)*13px);letter-spacing:.06em}
.lbl-lm.k-pt{fill:#3b2f2a;font-style:normal}
.num circle{fill:#2a221d;stroke:#fffdf8;stroke-width:2}
.num text{fill:#fff!important;stroke:none!important;font-size:11.5px;font-weight:700}
.num.ok circle{fill:var(--ok)} .num.bad circle{fill:var(--bad)} .num.focus circle{fill:var(--hl)}

@media (max-width:920px){
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  header{position:relative;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
  .brand h1{font-size:22px}
  .brand p{display:none}
  .hright{display:contents}
  .who{position:absolute;top:calc(9px + env(safe-area-inset-top));right:12px;padding:6px 11px;font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:0;background:rgba(255,253,248,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;flex-wrap:nowrap;justify-content:space-around}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:12px;font-size:11px;color:#7a6c60;min-width:0}
  nav.tabs button .ic{display:block;font-size:20px;line-height:1.1;filter:grayscale(.6);opacity:.75}
  nav.tabs button.on{background:transparent;box-shadow:none;color:var(--accent)}
  nav.tabs button.on .ic{filter:none;opacity:1}
  .layout{grid-template-columns:1fr;padding:0 8px 16px;gap:10px}
  .mapcard{position:sticky;top:0;z-index:5;border-radius:16px;margin-top:2px}
  .layout.menu .mapcard{display:none}
  .panel{position:static;max-height:none;padding:14px;border-radius:16px}
  #map{max-height:none}
  body.kb nav.tabs{display:none}
  body.kb{padding-bottom:0}
  body.kb #map{max-height:30svh}
  .zoomctl{right:8px;bottom:8px;gap:5px}
  .zoomctl button{width:34px;height:34px;font-size:18px;border-radius:10px}
  .prompt{padding:10px 14px;margin:2px 0 8px}
  .prompt .target{font-size:23px}
  .bigname{font-size:30px}
  .simrow input{font-size:16px}
  .btn{padding:11px 14px}
  .fb{min-height:0}
  .big{font-size:40px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Mapa de <span>España</span></h1>
    <p>Las 17 comunidades autónomas y los accidentes geográficos</p>
  </div>
  <div class="hright"><button class="who" id="whoBtn" title="Cambiar de persona">👤 <span id="whoName">¿Quién?</span></button>
  <nav class="tabs" id="tabs">
    <button data-v="aprender"><span class="ic">📘</span><span class="tl">Aprender</span></button>
    <button data-v="explorar"><span class="ic">🗺️</span><span class="tl">Explorar</span></button>
    <button data-v="localiza"><span class="ic">📍</span><span class="tl">Localiza</span></button>
    <button data-v="escribe"><span class="ic">✏️</span><span class="tl">Escribe</span></button>
    <button data-v="simulacro"><span class="ic">📝</span><span class="tl">Simulacro</span></button>
  </nav></div>
</header>
<div class="overlay" id="who" hidden><div class="modal">
  <h2>¿Quién estudia?</h2>
  <p class="muted">Each person gets their own progress on this device: lessons done, misses, settings.</p>
  <div id="whoList" class="wholist"></div>
  <form id="whoForm" class="row" style="margin-top:10px"><input class="type" id="whoInput" maxlength="24" placeholder="Tu nombre…" autocomplete="off" style="flex:1;font-size:16px;padding:10px 12px"><button class="btn" type="submit">Añadir</button></form>
  <p class="note" id="whoNote"></p>
</div></div>
<main class="layout" id="layout">
  <section class="mapcard"><div class="zoomctl"><button id="zIn" aria-label="Acercar">+</button><button id="zOut" aria-label="Alejar">−</button><button id="zReset" aria-label="Ver todo">⤢</button></div><svg id="map" viewBox="0 0 1480 1331" xmlns="http://www.w3.org/2000/svg" aria-label="Mapa de España"></svg></section>
  <aside class="panel" id="panel"></aside>
</main>

 // minor labels

 for(const r of REGIONS){const [x,y]=anchor(r);const t=r.id==='valencia'?`<tspan x="${f1(x)}" dy="-0.55em">Comunidad</tspan><tspan x="${f1(x)}" dy="1.1em">Valenciana</tspan>`:r.name;h+=`<text data-for="${r.id}" class="lbl lbl-com" x="${f1(x)}" y="${f1(y)}" text-anchor="middle" dominant-baseline="middle">${t}</text>`;}
 for(const l of LMS){

function addMiss(id){const s=store.get();s.miss=s.miss||{};s.miss[id]=(s.miss[id]||0)+1;store.set(s);}

const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function norm(s,art){s=s.normalize('NFC').toLowerCase().replace(/[-–—]/g,' ').replace(/[.,;:!¡¿?'"’]/g,'').replace(/\s+/g,' ').trim();if(art)s=s.replace(/^(el|la|los|las)\s+/,'');return s;}
function lev(a,b){a=[...a];b=[...b];const m=b.length;let prev=Array.from({length:m+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=m;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[m];}
function grade(input,it){
 const art=it.type==='lm', n=norm(input,art);
 if(!n) return {ok:false,kind:'empty',best:it.acc[0]};
 for(const a of it.acc) if(norm(a,art)===n) return {ok:true,kind:'exact',best:a};
 for(const a of it.acc) if(deacc(norm(a,art))===deacc(n)) return {ok:!strict,kind:'accent',best:a};
 let best=it.acc[0],bd=1e9;
 for(const a of it.acc){const d=lev(n,norm(a,art));if(d<bd){bd=d;best=a;}}
 return {ok:false,kind:(bd<=3&&n.length>=3)?'close':'wrong',best};
}
// highlight letters of `correct` that the user got wrong or left out
function diffHTML(user,correct){
 const a=[...user.trim().toLowerCase()],B=[...correct],b=B.map(c=>c.toLowerCase()),n=a.length,m=b.length;
 const d=Array.from({length:n+1},(_,i)=>{const r=new Array(m+1).fill(0);r[0]=i;return r;});for(let j=0;j<=m;j++)d[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 const fl=new Array(m).fill(false);let i=n,j=m;
 while(i>0&&j>0){const s=a[i-1]===b[j-1]?0:1;if(d[i][j]===d[i-1][j-1]+s){if(s)fl[j-1]=true;i--;j--;}else if(d[i][j]===d[i][j-1]+1){fl[j-1]=true;j--;}else i--;}
 while(j>0){fl[j-1]=true;j--;}
 return B.map((c,k)=>fl[k]&&c!==' '?`<mark>${esc(c)}</mark>`:esc(c)).join('');
}

/* ============ ZOOM, PAN, LABEL FITTING ============ */
const VB0={x:0,y:0,w:1480,h:1331}; let VB={...VB0};
function applyVB(){svg.setAttribute('viewBox',`${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);updateScale();}
function updateScale(){const r=svg.getBoundingClientRect();if(!r.width)return;const sc=Math.min(r.width/VB.w,r.height/VB.h);svg.style.setProperty('--u',(1/sc).toFixed(4));svg.classList.toggle('zoomed',VB.w<VB0.w-1);scheduleCull();}
function clampVB(){VB.w=Math.min(VB0.w,Math.max(VB0.w/10,VB.w));VB.h=VB.w*VB0.h/VB0.w;VB.x=Math.max(0,Math.min(VB0.w-VB.w,VB.x));VB.y=Math.max(0,Math.min(VB0.h-VB.h,VB.y));}
function zoomAbout(f,cx,cy,base=VB){const w=Math.min(VB0.w,Math.max(VB0.w/10,base.w/f)),k=w/base.w;VB={x:cx-(cx-base.x)*k,y:cy-(cy-base.y)*k,w,h:base.h*k};clampVB();applyVB();}
function toSvg(x,y){const p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomCenter(f){zoomAbout(f,VB.x+VB.w/2,VB.y+VB.h/2);}
function resetZoom(){VB={...VB0};applyVB();}
$('#zIn').onclick=()=>zoomCenter(1.6); $('#zOut').onclick=()=>zoomCenter(1/1.6); $('#zReset').onclick=resetZoom;
// pointer gestures: pinch to zoom, drag to pan (when zoomed); a drag never counts as a click
const PT=new Map(); let G=null, dragged=false;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
svg.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;PT.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(PT.size===1){dragged=false;G={t:'pan',sx:e.clientX,sy:e.clientY,vb:{...VB}};}
 else if(PT.size===2){const [a,b]=[...PT.values()];G={t:'pinch',d:dist(a,b),vb:{...VB},m:toSvg((a.x+b.x)/2,(a.y+b.y)/2)};dragged=true;}});
window.addEventListener('pointermove',e=>{if(!PT.has(e.pointerId)||!G)return;PT.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(G.t==='pinch'&&PT.size>=2){const [a,b]=[...PT.values()];zoomAbout(dist(a,b)/G.d,G.m.x,G.m.y,G.vb);e.preventDefault();}
 else if(G.t==='pan'){const dx=e.clientX-G.sx,dy=e.clientY-G.sy;if(Math.hypot(dx,dy)>6)dragged=true;
  if(dragged&&G.vb.w<VB0.w-1){const r=svg.getBoundingClientRect(),u=G.vb.w/r.width;VB={...G.vb,x:G.vb.x-dx*u,y:G.vb.y-dy*u};clampVB();applyVB();svg.classList.add('dragging');}}},{passive:false});
function endPtr(e){PT.delete(e.pointerId);if(PT.size===0){G=null;svg.classList.remove('dragging');}else if(PT.size===1&&G&&G.t==='pinch'){const [p]=[...PT.values()];G={t:'pan',sx:p.x,sy:p.y,vb:{...VB}};}}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);
svg.addEventListener('click',e=>{if(dragged){e.stopPropagation();e.preventDefault();dragged=false;}},true);
svg.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const p=toSvg(e.clientX,e.clientY);zoomAbout(Math.exp(-e.deltaY*0.01),p.x,p.y);},{passive:false});

const LPRI=['madrid','cyl','andalucia','clm','aragon','extremadura','cataluna','galicia','valencia','murcia','navarra','asturias','paisvasco','cantabria','rioja','baleares','canarias'].concat(LMS.map(l=>l.id));
let cullQ=false;function scheduleCull(){if(cullQ)return;cullQ=true;requestAnimationFrame(()=>{cullQ=false;cullLabels();});}
function cullLabels(){const L=svg.querySelector('#labels');const ts=[...L.querySelectorAll('text')];ts.forEach(t=>t.style.display='');
 if(getComputedStyle(L).display==='none')return;
 const hot=id=>{const f=featEl(id);return f&&(f.classList.contains('sel')||f.classList.contains('target'))?0:1;};
 const vis=ts.filter(t=>getComputedStyle(t).display!=='none').sort((a,b)=>hot(a.dataset.for)-hot(b.dataset.for)||LPRI.indexOf(a.dataset.for)-LPRI.indexOf(b.dataset.for));
 const kept=[];const pad=VB.w*0.004;
 for(const t of vis){if(t.dataset.for==='atlantico'){continue;}let b;try{b=t.getBBox();}catch(e){continue;}
  if(!b.width)continue;
  if(b.x+b.width<VB.x||b.x>VB.x+VB.w||b.y+b.height<VB.y||b.y>VB.y+VB.h)continue;
  if(kept.some(k=>b.x<k.x+k.width+pad&&b.x+b.width+pad>k.x&&b.y<k.y+k.height&&b.y+b.height>k.y)){t.style.display='none';continue;}
  kept.push(b);}
}

let L=null;
function startLocate(set,custom){
 setMenu(false);
 const pool=custom||setPool(set);
 const mixed=custom?(custom.some(i=>i.type==='lm')&&custom.some(i=>i.type==='com')?'all':custom[0].type):set;
 svgMode('locate',mixed==='com'||mixed==='lm'?mixed:'all');
 L={set:custom?mixed:set,items:shuffle(pool),i:0,tries:0,score:0,missed:[],lock:false};
 clickHandler=onLocate; renderLocate();
}
function renderLocate(){
 if(L.i>=L.items.length){clickHandler=null;clearMarks();return summary('localiza',L.set,L.score,L.items.length,L.missed);}
 const it=L.items[L.i];
 panel.innerHTML=`<div class="stat"><span>${L.i+1} de ${L.items.length}</span><span>✓ ${L.score}</span></div>
 <div class="bar"><div style="width:${L.i/L.items.length*100}%"></div></div>
 <div class="prompt"><small>Haz clic en</small><div class="target">${esc(it.name)}</div></div>
 <div class="fb" id="fb"></div>
 <div class="row"><button class="btn ghost small" id="skip">No lo sé, muéstramelo</button><button class="btn ghost small" id="quit">Salir</button></div>`;
 $('#skip').onclick=()=>{if(L.lock)return;if(L.tries<1){L.missed.push(it);addMiss(it.id);}L.tries=2;mark(it.id,'target');fb('warn',`Here it is. Click <b>${esc(it.name)}</b> to continue.`);};
 $('#quit').onclick=()=>{clickHandler=null;chooser('localiza');};
}
function fb(kind,html){const e=$('#fb');if(!e)return;e.className='fb show '+kind;e.innerHTML=html;}
function onLocate(id){
 if(L.lock) return; const it=L.items[L.i];
 if(id===it.id){
  L.lock=true; unmark(id); mark(id,'ok');
  if(L.tries===0){L.score++;addHit(id);fb('ok','¡Correcto! ✓');}else fb('ok','Ahí está.');
  setTimeout(()=>{unmark(id);L.i++;L.tries=0;L.lock=false;renderLocate();},L.tries?650:550);
 } else {
  L.tries++; flash(id,'bad');
  if(L.tries===1){L.missed.push(it);addMiss(it.id);}
  if(L.tries>=2){mark(it.id,'target');fb('bad',`That's <b>${esc(BY[id].name)}</b>. The correct one is flashing orange. Click it.`);}
  else fb('bad',`That's <b>${esc(BY[id].name)}</b>. Try again.`);
 }
}

/* ---- Escribe ---- */
let T=null;
function startType(set,custom){
 setMenu(false);
 const pool=custom||setPool(set);
 const mixed=custom?(custom.some(i=>i.type==='lm')&&custom.some(i=>i.type==='com')?'all':custom[0].type):set;
 svgMode('type',mixed==='com'||mixed==='lm'?mixed:'all');
 T={set:custom?mixed:set,items:shuffle(pool),i:0,score:0,total:pool.length,missed:[],requeued:new Set(),fix:false,hint:0,done:false};
 renderType();
}
function hintText(name,lv){return [...name].map((c,k,arr)=>{if(c===' '||c==='-')return c;const first=k===0||arr[k-1]===' '||arr[k-1]==='-';return (lv>=2&&k%2===0)||first?c:'_';}).join(' ').replace(/ {3}/g,'   ');}
function renderType(){
 clearMarks();
 if(T.i>=T.items.length){return summary('escribe',T.set,T.score,T.total,T.missed);}
 const it=T.items[T.i]; mark(it.id,'target'); T.fix=false; T.hint=0; T.done=false;
 const first=!T.requeued.has(it.id)||T.items.indexOf(it)===T.i&&T.i<T.total;
 panel.innerHTML=`<div class="stat"><span>${Math.min(T.i+1,T.items.length)} de ${T.items.length}</span><span>✓ ${T.score} / ${T.total}</span></div>
 <div class="bar"><div style="width:${T.i/T.items.length*100}%"></div></div>
 <div class="prompt"><small>${kindLabel(it)}${T.i>=T.total?' · repaso':''}</small><div class="target" style="font-size:20px">¿Cómo se llama lo que está en naranja?</div></div>
 <input class="type" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Escribe el nombre…">
 <div class="keys">${['á','é','í','ó','ú','ñ','ü'].map(k=>`<button data-k="${k}" tabindex="-1">${k}</button>`).join('')}</div>
 <div class="fb" id="fb"></div>
 <div class="row"><button class="btn" id="chk">Comprobar</button><button class="btn ghost" id="hint">Pista</button><button class="btn ghost" id="idk">No lo sé</button></div>
 <p class="note"><kbd>Enter</kbd> to check / continue.</p>`;
 const inp=$('#ans'); setTimeout(()=>inp.focus({preventScroll:true}),30);
 panel.querySelectorAll('.keys button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.k+inp.value.slice(e2);inp.focus();inp.setSelectionRange(s+1,s+1);};});
 inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();T.done?next():check();}};
 $('#chk').onclick=()=>T.done?next():check();
 $('#hint').onclick=()=>{T.hint=Math.min(2,T.hint+1);fb('warn',`Pista: <span class="ans" style="letter-spacing:.08em">${esc(hintText(it.name,T.hint))}</span>`);inp.focus();};
 $('#idk').onclick=()=>{if(T.done)return;miss(it);T.fix=true;fb('bad',`It's <span class="ans">${esc(it.name)}</span>. Type it to continue.`);inp.value='';inp.focus();};
}
function miss(it){if(!T.fix&&!T.requeued.has(it.id)){T.missed.push(it);addMiss(it.id);T.requeued.add(it.id);T.items.push(it);}}
function check(){
 const it=T.items[T.i], inp=$('#ans'), v=inp.value; const g=grade(v,it);
 if(g.kind==='empty'){inp.focus();return;}
 if(g.ok){
  const counted=!T.fix&&T.i<T.total;
  if(counted){T.score++;addHit(it.id);}
  T.done=true; unmark(it.id); mark(it.id,'ok');
  const note=g.kind==='accent'?` (but watch the accents: <span class="ans">${esc(g.best)}</span>)`:'';
  fb('ok',`${T.fix?'Bien, ya lo tienes.':'¡Correcto!'} <span class="ans">${esc(it.name)}</span>${note}`);
  $('#chk').textContent='Siguiente →';
  setTimeout(()=>{if(T.done&&T.items[T.i]===it)next();},g.kind==='exact'&&!T.fix?900:1800);
  return;
 }
 miss(it); T.fix=true;
 const d=diffHTML(v,g.best);
 if(g.kind==='accent') fb('warn',`Almost, just the accents: <span class="ans">${d}</span><br><span class="muted">Type it again with the accents.</span>`);
 else if(g.kind==='close') fb('bad',`Close. Correct spelling: <span class="ans">${d}</span><br><span class="muted">Highlighted letters are the ones you missed. Type it correctly.</span>`);
 else fb('bad',`No. It's <span class="ans">${esc(it.name)}</span>.<br><span class="muted">Type it to continue.</span>`);
 inp.value=''; inp.focus();
}
function next(){T.i++;renderType();}

let S=null;
function startSim(set,custom){
 setMenu(false);
 const pool=custom||setPool(set);
 const mixed=custom?(custom.some(i=>i.type==='lm')&&custom.some(i=>i.type==='com')?'all':custom[0].type):set;

 S={set:custom?mixed:set,items:shuffle(pool),checked:false};
 let n='';
 S.items.forEach((it,k)=>{const [x,y]=anchor(it);n+=`<g class="num" data-n="${k}" transform="translate(${f1(x)} ${f1(y)})"><g class="sc"><circle r="10.5"/><text text-anchor="middle" dominant-baseline="central" y="0.5">${k+1}</text></g></g>`;});
 $('#numLayer').innerHTML=n;
 panel.innerHTML=`<h2>Simulacro</h2><p class="muted">Write the name for each number. Click an input to see which one it is on the map (it lights up orange).</p>
 <div class="simlist">${S.items.map((it,k)=>`<div class="simrow" data-k="${k}"><div class="n">${k+1}</div><input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${it.type==='com'?'comunidad':'accidente geográfico'}"></div>`).join('')}</div>
 <div class="keys" id="simkeys">${['á','é','í','ó','ú','ñ','ü'].map(k=>`<button data-k="${k}" tabindex="-1">${k}</button>`).join('')}</div>
 <div class="row"><button class="btn" id="grade">Corregir</button><button class="btn ghost" id="quit">Salir</button></div><div id="simres"></div>`;
 let last=null;
 panel.querySelectorAll('.simrow input').forEach((inp,k)=>{
  inp.onfocus=()=>{last=inp;clearFocus();const it=S.items[k];mark(it.id,S.checked?'sel':'target');svg.querySelector(`.num[data-n="${k}"]`).classList.add('focus');};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const nx=panel.querySelectorAll('.simrow input')[k+1];if(nx)nx.focus();}};
 });
 panel.querySelectorAll('#simkeys button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{if(!last)return;const s=last.selectionStart??last.value.length,e2=last.selectionEnd??s;last.value=last.value.slice(0,s)+b.dataset.k+last.value.slice(e2);last.focus();last.setSelectionRange(s+1,s+1);};});
 $('#grade').onclick=gradeSim; $('#quit').onclick=()=>chooser('simulacro');
}
function clearFocus(){svg.querySelectorAll('.feat.target,.feat.sel').forEach(e=>{e.classList.remove('target');e.classList.remove('sel');});svg.querySelectorAll('.num.focus').forEach(e=>e.classList.remove('focus'));}
function gradeSim(){
 clearFocus(); let score=0; const missed=[];
 panel.querySelectorAll('.simrow').forEach((row,k)=>{
  const it=S.items[k], inp=row.querySelector('input'), g=grade(inp.value,it);
  row.classList.remove('ok','bad'); row.querySelector('.corr')?.remove();
  const num=svg.querySelector(`.num[data-n="${k}"]`); num.classList.remove('ok','bad');
  if(g.ok){score++;row.classList.add('ok');num.classList.add('ok');addHit(it.id);if(g.kind==='accent')row.insertAdjacentHTML('beforeend',`<div class="corr" style="color:#7a5600">accents: ${esc(g.best)}</div>`);}
  else{row.classList.add('bad');num.classList.add('bad');missed.push(it);addMiss(it.id);
   const why=g.kind==='accent'?'accents: ':g.kind==='close'?'spelling: ':'';
   row.insertAdjacentHTML('beforeend',`<div class="corr">${why}${g.kind==='accent'||g.kind==='close'?diffHTML(inp.value,g.best):esc(it.name)}</div>`);}
 });
 S.checked=true;
 const pct=Math.round(score/S.items.length*100);
 $('#simres').innerHTML=`<div class="fb show ${pct>=85?'ok':pct>=60?'warn':'bad'}" style="margin-top:12px"><b style="font-size:20px">${score}/${S.items.length}</b> · ${pct}%</div>
 <div class="row">${missed.length?`<button class="btn" id="simMiss">Practicar mis ${missed.length} fallos</button>`:''}<button class="btn ghost" id="simNew">Nuevo simulacro</button></div>`;
 if(missed.length) $('#simMiss').onclick=()=>startType('custom',missed);
 $('#simNew').onclick=()=>startSim(S.set);
 $('#grade').textContent='Corregir de nuevo';
 $('#simres').scrollIntoView({behavior:'smooth',block:'nearest'});
}

 <div class="lessons">${LESSONS.map((l,k)=>{const head=l.kind!==lastKind&&l.kind!=='Repaso'?`<div class="grouph">${l.kind==='Comunidades'?'Parte 1 · Comunidades autónomas':'Parte 2 · Accidentes geográficos'}</div>`:'';if(l.kind!=='Repaso')lastKind=l.kind;const st=done.includes(l.id)?'done':next&&next.id===l.id?'next':'';
  return head+`<button class="lesson ${st} ${l.review?'review':''}" data-l="${l.id}"><span class="ln">${done.includes(l.id)?'✓':l.review?'★':k+1-LESSONS.slice(0,k).filter(x=>x.review).length}</span><span class="lt"><b>${esc(l.title)}</b><small>${l.review?l.items.length+' items':l.items.map(i=>esc(BY[i].name)).join(' · ')}</small></span>${st==='next'?'<span class="go">Empezar →</span>':''}</button>`;}).join('')}</div>
 ${done.length?'<p class="note"><button class="btn ghost small" id="resetL">Reset progress</button></p>':''}`;
 panel.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>startLesson(b.dataset.l));
 const r=$('#resetL'); if(r) r.onclick=()=>{const s=store.get();s.learn=[];store.set(s);learnMenu();};
 // color regions already learned
 const learned=new Set(LESSONS.filter(l=>done.includes(l.id)).flatMap(l=>l.items));
 svg.classList.remove('colors'); if(!LESSONS.some(l=>l.kind==='Accidentes'&&done.includes(l.id))) svg.classList.add('hide-lm');
 svg.classList.add('passive'); learned.forEach(id=>{const e=featEl(id);if(e&&BY[id].type==='com')e.classList.add('learned');});
}
function lessonSet(l){const t=new Set(l.items.map(i=>BY[i].type));return t.size>1?'all':[...t][0];}
function learnedBefore(l){const k=LESSONS.indexOf(l);return LESSONS.slice(0,k).flatMap(x=>x.items);}
function learnMap(l,extraLabels=[]){
 svgMode('learn',lessonSet(l));
 const prev=new Set(learnedBefore(l));
 prev.forEach(id=>{const e=featEl(id);if(e&&BY[id].type==='com')e.classList.add('learned');});
 svg.classList.add('picknames');
 svg.querySelectorAll('#labels text').forEach(t=>t.classList.toggle('on',(prev.has(t.dataset.for)&&!l.review)||extraLabels.includes(t.dataset.for)));
}
function startLesson(id){
 setMenu(false);
 const l=LESSONS.find(x=>x.id===id);
 LN={l,phase:l.review?'find':'intro',i:0,queue:[],tries:0,score:0,first:0,again:new Set(),lock:false};
 if(l.review){beginFind();}else{renderIntro();}
}
function lessonHead(sub){const l=LN.l;const phases=l.review?['find','recall']:['intro','find','copy','recall'];const names={intro:'Mira',find:'Encuentra',copy:'Copia',recall:'Escribe'};
 return `<div class="lhead"><button class="btn ghost small" id="lback">← Lecciones</button><span class="muted">${esc(l.title)}</span></div>
 <div class="steps">${phases.map(p=>`<span class="${p===LN.phase?'on':phases.indexOf(p)<phases.indexOf(LN.phase)?'past':''}">${names[p]}</span>`).join('')}</div>${sub||''}`;}
function wireBack(){const b=$('#lback');if(b)b.onclick=()=>{clickHandler=null;learnMenu();};}

function renderIntro(){
 const l=LN.l, it=BY[l.items[LN.i]];
 learnMap(l,l.items.slice(0,LN.i+1)); clearMarks(); mark(it.id,'sel');
 panel.innerHTML=lessonHead()+`
 ${LN.i===0?`<div class="tip">${esc(l.tip)}</div>`:''}
 <div class="intro">
  <small class="muted">${kindLabel(it)} · ${LN.i+1} de ${l.items.length}</small>
  <div class="bigname">${accentHTML(it.name)}</div>
  <div class="row" style="gap:6px;margin:4px 0 8px">${canSpeak?`<button class="btn ghost small" id="speak">🔊 Escuchar</button>`:''}<span class="muted" style="font-size:13px">${accentNote(it.name)}</span></div>
  ${it.cap?`<div class="muted" style="font-size:14px">Capital: ${esc(it.cap)}</div>`:''}
  <p style="font-size:15px">${esc(it.fact)}</p>
  <p class="muted" style="font-size:13px">It's lit up in orange on the map.</p>
 </div>
 <div class="row"><button class="btn ghost" id="prev" ${LN.i===0?'disabled':''}>←</button><button class="btn" id="next">${LN.i<l.items.length-1?'Siguiente →':'¡Ya lo tengo! Practicar →'}</button></div>`;
 wireBack();
 const sp=$('#speak'); if(sp) sp.onclick=()=>say(it.name);
 $('#prev').onclick=()=>{LN.i--;renderIntro();};
 $('#next').onclick=()=>{if(LN.i<l.items.length-1){LN.i++;renderIntro();}else beginFind();};
}

function beginFind(){LN.phase='find';LN.queue=shuffle(LN.l.items);LN.i=0;LN.tries=0;LN.again=new Set();learnMap(LN.l);clickHandler=learnClick;renderFind();}
function renderFind(){
 const l=LN.l; if(LN.i>=LN.queue.length){clickHandler=null;return LN.l.review?beginType('recall'):beginType('copy');}
 const it=BY[LN.queue[LN.i]];
 panel.innerHTML=lessonHead(`<div class="stat" style="margin-top:8px"><span>${Math.min(LN.i+1,LN.queue.length)} de ${LN.queue.length}</span><span></span></div><div class="bar"><div style="width:${LN.i/LN.queue.length*100}%"></div></div>`)+`
 <div class="prompt"><small>Haz clic en</small><div class="target">${esc(it.name)}</div></div>
 <div class="fb" id="fb"></div>
 <div class="row"><button class="btn ghost small" id="show">Muéstramelo</button></div>`;
 wireBack();
 $('#show').onclick=()=>{if(LN.lock)return;LN.tries=2;LN.again.add(it.id);mark(it.id,'target');fb('warn',`Here it is. Click <b>${esc(it.name)}</b>.`);};
}
function learnClick(id){
 if(LN.lock||LN.phase!=='find')return; const it=BY[LN.queue[LN.i]];
 if(id===it.id){LN.lock=true;unmark(id);mark(id,'ok');fb('ok',LN.tries?'Ahí está.':'¡Correcto! ✓');
  if(LN.tries&&!LN.again.has('q'+it.id)){LN.again.add('q'+it.id);LN.queue.push(it.id);}
  setTimeout(()=>{unmark(id);LN.i++;LN.tries=0;LN.lock=false;renderFind();},600);}
 else{LN.tries++;flash(id,'bad');if(LN.tries>=2){mark(it.id,'target');fb('bad',`That's ${esc(BY[id].name)}. The right one is flashing orange. Click it.`);}else fb('bad',`That's <b>${esc(BY[id].name)}</b>. Try again.`);}
}

function beginType(mode){LN.phase=mode;LN.queue=shuffle(LN.l.items);LN.i=0;LN.fix=false;LN.done=false;LN.requeued=new Set();if(mode==='recall'){LN.score=0;LN.total=LN.queue.length;}learnMap(LN.l);svg.classList.add('passive');renderType2();}
function renderType2(){
 clearMarks();
 if(LN.i>=LN.queue.length){ if(LN.phase==='copy') return beginType('recall'); return lessonDone(); }
 const it=BY[LN.queue[LN.i]]; mark(it.id,'target'); LN.fix=false; LN.done=false;
 const copy=LN.phase==='copy';
 panel.innerHTML=lessonHead(`<div class="stat" style="margin-top:8px"><span>${LN.i+1} de ${LN.queue.length}</span><span>${copy?'':'✓ '+LN.score}</span></div><div class="bar"><div style="width:${LN.i/LN.queue.length*100}%"></div></div>`)+`
 <div class="prompt"><small>${copy?'Copia el nombre (con acentos)':'¿Cómo se llama lo que está en naranja?'}</small>
 ${copy?`<div class="target">${accentHTML(it.name)}</div>`:`<div class="target" style="font-size:18px;color:var(--muted)">${kindLabel(it)}</div>`}</div>
 <input class="type" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${copy?'Escribe exactamente lo de arriba…':'Escribe el nombre…'}">
 <div class="keys">${['á','é','í','ó','ú','ñ','ü'].map(k=>`<button data-k="${k}" tabindex="-1">${k}</button>`).join('')}</div>
 <div class="fb" id="fb"></div>
 <div class="row"><button class="btn" id="chk">Comprobar</button>${copy?'':'<button class="btn ghost" id="idk">No me acuerdo</button>'}</div>
 <p class="note">${copy?'Articles like "el" or "los" are optional for landmarks. Accents count.':'Accents count. Press <kbd>Enter</kbd> to check.'}</p>`;
 wireBack();
 const inp=$('#ans'); setTimeout(()=>inp.focus({preventScroll:true}),30);
 panel.querySelectorAll('.keys button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.k+inp.value.slice(e2);inp.focus();inp.setSelectionRange(s+1,s+1);};});
 const go2=()=>LN.done?(LN.i++,renderType2()):check2();
 inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go2();}};
 $('#chk').onclick=go2;
 const idk=$('#idk'); if(idk) idk.onclick=()=>{if(LN.done)return;miss2(it);LN.fix=true;fb('bad',`It's <span class="ans">${accentHTML(it.name)}</span>. Type it to continue.`);inp.value='';inp.focus();};
}
function miss2(it){addMiss(it.id);if(LN.phase==='recall'&&!LN.fix&&!LN.requeued.has(it.id)){LN.requeued.add(it.id);LN.queue.push(it.id);}}
function check2(){
 const it=BY[LN.queue[LN.i]], inp=$('#ans'), v=inp.value; if(!v.trim()){inp.focus();return;}
 const was=strict; strict=true; const g=grade(v,it); strict=was;
 if(g.ok){
  if(LN.phase==='recall'&&!LN.fix&&LN.i<LN.total){LN.score++;addHit(it.id);}
  LN.done=true; unmark(it.id); mark(it.id,'ok');
  fb('ok',`${LN.fix?'Bien, ya lo tienes.':'¡Perfecto!'} <span class="ans">${accentHTML(it.name)}</span>`);
  $('#chk').textContent='Siguiente →';
  setTimeout(()=>{if(LN.done&&LN.queue[LN.i]===it.id&&$('#ans')===inp){LN.i++;renderType2();}},LN.fix?1500:850);
  return;
 }
 miss2(it); LN.fix=true;
 const d=diffHTML(v,g.best);
 if(g.kind==='accent') fb('warn',`Almost, check the accents: <span class="ans">${d}</span><br><span class="muted">Type it again.</span>`);
 else if(g.kind==='close') fb('bad',`Close. Correct spelling: <span class="ans">${d}</span><br><span class="muted">Highlighted letters are the ones you missed. Type it again.</span>`);
 else fb('bad',`It's <span class="ans">${accentHTML(it.name)}</span>.<br><span class="muted">Type it to continue.</span>`);
 inp.value=''; inp.focus();
}
function lessonDone(){
 const l=LN.l; setDone(l.id); clearMarks(); learnMap(l,l.items); svg.classList.remove('passive');
 l.items.forEach(id=>{const e=featEl(id);if(e&&BY[id].type==='com')e.classList.add('learned');});
 const k=LESSONS.indexOf(l), next=LESSONS[k+1];
 const pct=LN.total?Math.round(LN.score/LN.total*100):100;
 panel.innerHTML=lessonHead()+`<div class="donebox"><div class="big">${pct===100?'🎉':'✓'}</div><h2>¡Lección completada!</h2>
 <p>From memory: <b>${LN.score}/${LN.total}</b> on the first try.</p>
 ${pct<75?'<p class="muted">Tip: do it once more before moving on. It sticks better.</p>':''}</div>
 <div class="row">${next?`<button class="btn" id="nextL">Siguiente: ${esc(next.title)} →</button>`:''}<button class="btn ghost" id="again">Repetir</button><button class="btn ghost" id="menu">Lecciones</button></div>`;
 wireBack();
 if(next) $('#nextL').onclick=()=>startLesson(next.id);
 $('#again').onclick=()=>startLesson(l.id);
 $('#menu').onclick=()=>learnMenu();
}

/* ---- ¿Quién estudia? (profiles) ---- */
function whoProgress(name){try{const d=JSON.parse(localStorage.getItem('mapaES1:'+name))||{};const n=(d.learn||[]).filter(id=>LESSONS.some(l=>l.id===id)).length;return n?`${n}/${LESSONS.length} lecciones`:'nuevo';}catch(e){return '';}}
function renderWho(){const p=PROF.get();$('#whoName').textContent=p.cur||'¿Quién?';
 $('#whoList').innerHTML=p.list.length?p.list.map(n=>`<div class="whorow"><button class="pick ${n===p.cur?'cur':''}" data-n="${esc(n)}">${esc(n)}<small>${whoProgress(n)}</small></button><button class="del" data-d="${esc(n)}" title="Borrar">✕</button></div>`).join(''):'<p class="muted">No one yet. Add your name to start.</p>';
 $('#whoList').querySelectorAll('.pick').forEach(b=>b.onclick=()=>switchWho(b.dataset.n));
 $('#whoList').querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='¿Borrar?';setTimeout(()=>{if(b.isConnected){b.classList.remove('sure');b.textContent='✕';}},3000);return;}
  const n=b.dataset.d,q=PROF.get();q.list=q.list.filter(x=>x!==n);if(q.cur===n)q.cur=null;PROF.set(q);try{localStorage.removeItem('mapaES1:'+n);}catch(e){}renderWho();if(!q.cur)go(view);});
}
function openWho(){renderWho();$('#who').hidden=false;setTimeout(()=>$('#whoInput').focus(),30);}
function closeWho(){if(!PROF.get().cur)return;$('#who').hidden=true;}
function switchWho(n){const p=PROF.get();p.cur=n;PROF.set(p);const s=store.get();strict=s.strict!==false;EX.sel=null;$('#who').hidden=true;renderWho();go(view);}
$('#whoBtn').onclick=openWho;
$('#who').onclick=e=>{if(e.target.id==='who')closeWho();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#who').hidden)closeWho();});
$('#whoForm').onsubmit=e=>{e.preventDefault();const n=$('#whoInput').value.trim().replace(/\s+/g,' ');if(!n)return;const p=PROF.get();
 if(p.list.some(x=>x.toLowerCase()===n.toLowerCase())){$('#whoNote').textContent='That name already exists. Tap it above.';return;}
 // first profile on this device inherits any progress saved before profiles existed
 if(!p.list.length){try{const old=localStorage.getItem('mapaES1');if(old)localStorage.setItem('mapaES1:'+n,old);}catch(_){}}
 p.list.push(n);PROF.set(p);$('#whoInput').value='';$('#whoNote').textContent='';switchWho(n);};
renderWho();
/* ============ START ============ */
const h0=location.hash.slice(1);
go(VIEWS.includes(h0)?h0:'aprender');
updateScale();
if(!PROF.get().cur) openWho();
</script>
</body>
